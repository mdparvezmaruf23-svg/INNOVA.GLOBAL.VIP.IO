<body>

<script>
/* =========================================================
   INNOVA.GLOBAL
   FRONTEND PROTOTYPE
   ========================================================= */

const DB_KEY="INNOVA_GLOBAL_DB_FINAL_V6";
const CURRENT_KEY="INNOVA_CURRENT_USER_V6";
const ADMIN_KEY="INNOVA_ADMIN_SESSION_V6";

const ADMIN_ID="INNOVA0001";
const ADMIN_PASSWORD="Innova1234";
const RECEIVER="01313213083";

const PROGRAMS=[
  {id:"P100",name:"PROGRAM 1",price:100},
  {id:"P200",name:"PROGRAM 2",price:200},
  {id:"P300",name:"PROGRAM 3",price:300},
  {id:"P500",name:"PROGRAM 4",price:500},
  {id:"P1000",name:"PROGRAM 5",price:1000},
  {id:"P2000",name:"PROGRAM 6",price:2000},
  {id:"P5000",name:"PROGRAM 7",price:5000},
  {id:"P10000",name:"PROGRAM 8",price:10000}
];

const DEFAULT_SETTINGS={
  idFee:250,
  durationDays:15,
  adsPerDay:12,
  adSeconds:20,
  receiver:RECEIVER,
  rewardPercent:50,
  level1:0,
  level2:0,
  level3:0
};

function defaultDB(){
  return {
    users:[],
    payments:[],
    withdrawals:[],
    transactions:[],
    notifications:[],
    support:[],
    settings:{...DEFAULT_SETTINGS}
  };
}

function getDB(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(!raw){
      const db=defaultDB();
      saveDB(db);
      return db;
    }

    const db=JSON.parse(raw);

    db.users=db.users||[];
    db.payments=db.payments||[];
    db.withdrawals=db.withdrawals||[];
    db.transactions=db.transactions||[];
    db.notifications=db.notifications||[];
    db.support=db.support||[];
    db.settings={...DEFAULT_SETTINGS,...(db.settings||{})};

    return db;
  }catch(e){
    const db=defaultDB();
    saveDB(db);
    return db;
  }
}

function saveDB(db){
  localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function getUsers(){
  return getDB().users;
}

function currentUser(){
  const id=localStorage.getItem(CURRENT_KEY);
  if(!id)return null;
  return getUsers().find(u=>u.innovaId===id)||null;
}

function isAdmin(){
  return localStorage.getItem(ADMIN_KEY)==="1";
}

function money(n){
  return "৳"+Number(n||0).toLocaleString("en-US");
}

function normalizeId(v){
  v=String(v||"").trim().toUpperCase();

  if(/^\d{1,4}$/.test(v)){
    v="INNOVA"+v.padStart(4,"0");
  }

  return v;
}

function nextId(){
  const users=getUsers();

  let max=0;

  users.forEach(u=>{
    const m=String(u.innovaId||"").match(/INNOVA(\d{4})/);
    if(m){
      max=Math.max(max,Number(m[1]));
    }
  });

  return "INNOVA"+String(max+1).padStart(4,"0");
}

function referralCodeFor(id){
  const n=Number(String(id).replace("INNOVA",""));
  return "REF"+String(n).padStart(4,"0");
}

function findUser(id){
  return getUsers().find(u=>u.innovaId===normalizeId(id));
}

function showPage(html){
  document.getElementById("app").innerHTML=html;
  updateClock();
  refreshMenu();
}

function topbar(){
  return `
    <div class="topbar">
      <div class="brand">🌍 INNOVA.GLOBAL</div>
      <button class="menu-btn" onclick="toggleMenu()">☰ MENU</button>
    </div>

    <div id="menu" class="menu hidden">

      <button onclick="openDashboard();toggleMenu()">🏠 Dashboard</button>
      <button onclick="openGlobalTeam();toggleMenu()">🌍 Global Team</button>
      <button onclick="openPrograms();toggleMenu()">📦 Programs</button>
      <button onclick="openActivity();toggleMenu()">📺 Ad Center</button>
      <button onclick="openReferral();toggleMenu()">🔗 Referral</button>
      <button onclick="openMyTeam();toggleMenu()">👥 My Team</button>
      <button onclick="openEarnings();toggleMenu()">💰 Earnings</button>
      <button onclick="openWithdraw();toggleMenu()">💳 Withdraw</button>
      <button onclick="openTransactions();toggleMenu()">📜 Transactions</button>
      <button onclick="openNotifications();toggleMenu()">🔔 Notifications</button>
      <button onclick="openSupport();toggleMenu()">🎧 Direct Support</button>
      <button onclick="openSettings();toggleMenu()">⚙️ Settings</button>

      <button id="adminMenuButton"
              class="hidden"
              onclick="openAdmin();toggleMenu()">
        👑 ADMIN PANEL
      </button>

      <button onclick="logout()">🚪 Logout</button>
    </div>
  `;
}

function toggleMenu(){
  const m=document.getElementById("menu");
  if(m)m.classList.toggle("hidden");
}

function refreshMenu(){
  const b=document.getElementById("adminMenuButton");
  if(b){
    b.classList.toggle("hidden",
      !(currentUser() && currentUser().innovaId===ADMIN_ID)
    );
  }
}

function logout(){
  localStorage.removeItem(CURRENT_KEY);
  localStorage.removeItem(ADMIN_KEY);
  welcome();
}

/* =========================================================
   WELCOME
   ========================================================= */

/* =========================================================
   REGISTER
   ========================================================= */

function openRegister(){

  showPage(`
    <div class="page">

      <button class="btn dark back" onclick="welcome()">← Back</button>

      <div class="card">

        <h2 class="section-title">📝 CREATE ACCOUNT</h2>

        <div id="registerMessage"></div>

        <form onsubmit="registerUser(event)">

          <div class="form-group">
            <label>Full Name</label>
            <input id="regName" required>
          </div>

          <div class="form-group">
            <label>Mobile Number</label>
            <input id="regMobile" inputmode="numeric" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input id="regPassword" type="password" required>
          </div>

          <div class="payment-box">

            <b style="color:var(--cyan)">
              🔗 Referral
            </b>

            <p class="small" style="margin-top:8px">
              INNOVA0001-এর জন্য Referral Code প্রয়োজন নেই।
              পরবর্তী Member-এর জন্য Referral Code প্রয়োজন হবে।
            </p>

            <br>

            <label>Referral Code</label>
            <input id="regReferral" placeholder="যেমন REF0001">

          </div>

          <button class="btn full">
            CREATE ACCOUNT
          </button>

        </form>

      </div>
    </div>
  `);
}

function registerUser(e){

  e.preventDefault();

  const name=document.getElementById("regName").value.trim();
  const mobile=document.getElementById("regMobile").value.trim();
  const password=document.getElementById("regPassword").value;
  const referral=document.getElementById("regReferral").value.trim().toUpperCase();

  const msg=document.getElementById("registerMessage");

  const db=getDB();

  if(!name||!mobile||!password){
    msg.innerHTML=`<div class="message error">সব তথ্য পূরণ করুন।</div>`;
    return;
  }

  if(db.users.some(u=>u.mobile===mobile)){
    msg.innerHTML=`<div class="message error">এই Mobile Number ইতিমধ্যে ব্যবহার করা হয়েছে।</div>`;
    return;
  }

  const id=nextId();

  if(id!=="INNOVA0001" && !referral){
    msg.innerHTML=`<div class="message error">

   ========================================================= */

function directMembers(id){
  return getUsers().filter(u=>u.referredBy===id);
}

function directCount(id){
  return directMembers(id).length;
}

function allDownline(id){

  const result=[];
  const queue=[id];

  while(queue.length){

    const parent=queue.shift();

    const children=directMembers(parent);

    children.forEach(c=>{
      result.push(c);
      queue.push(c.innovaId);
    });
  }

  return result;
}

function teamCount(id){
  return allDownline(id).length;
}

function generationHTML(id){

  const g1=directMembers(id);

  const g2=[];
  g1.forEach(x=>{
    g2.push(...directMembers(x.innovaId));
  });

  const g3=[];
  g2.forEach(x=>{
    g3.push(...directMembers(x.innovaId));
  });

  function nodes(arr){
    if(!arr.length){
      return `<div class="small">None</div>`;
    }

    return arr.map(u=>`
      <div class="node ${u.active?'active-node':'dead-node'}"
           title="${u.innovaId}">
        ${u.innovaId.replace("INNOVA","")}
      </div>
    `).join("");
  }

  return `
    <div class="gen-tree">

      <div class="you-node">YOU</div>

      <div style="font-size:28px;color:var(--cyan);margin:10px">
        │
      </div>

      <div class="gens">

        <div class="gen-col">
          <div class="gen-label">GENERATION 1</div>
          ${nodes(g1)}
        </div>

        <div class="gen-col">
          <div class="gen-label">GENERATION 2</div>
          ${nodes(g2)}
        </div>

        <div class="gen-col">
          <div class="gen-label">GENERATION 3</div>
          ${nodes(g3)}
        </div>

      </div>

    </div>
  `;
}

function isPackageActive(user,pid){

  if(user.master)return true;

  const data=getPackageData(user,pid);

  if(!data.active)return false;

  if(data.expiresAt && Date.now()>data.expiresAt){
    return false;
  }

  return true;
}

function getPackageData(user,pid){

  if(!user.packageData)user.packageData={};

  if(!user.packageData[pid]){
    user.packageData[pid]={
      active:false,
      approved:false,
      activatedAt:0,
      expiresAt:0,
      totalEarned:0,
      todayReward:0,
      cycle:null,
      completedToday:false,
      completedAds:0
    };
  }

  return user.packageData[pid];
}

/* =========================================================
   ACTIVITY
   ========================================================= */

function openActivity(pid){

  const user=currentUser();

  if(!user){
    openLogin();
    return;
  }

  const p=PROGRAMS.find(x=>x.id===pid);

  if(!p)return;

  if(!isPackageActive(user,pid)){
    alert("এই Program Active নয়।");
    openPrograms();
    return;
  }

  if(user.master){
    startActivity(pid);
    return;
  }

  if(!user.active){
    alert("আপনার ID এখনো Active হয়নি।");
    return;
  }

  startActivity(pid);
}

function startActivity(pid){

  const user=currentUser();

  if(!user)return;

  const p=PROGRAMS.find(x=>x.id===pid);
  const data=getPackageData(user,pid);

  if(data.expiresAt && Date.now()>data.expiresAt){
    data.active=false;
    saveCurrentUser(user);
    alert("এই Program-এর 15 দিন শেষ হয়েছে।");
    openPrograms();
    return;
  }

  if(!data.cycle || Date.now()-data.cycle.started>=86400000){

    data.cycle={
      started:Date.now(),
      completed:0,
      rewarded:false
    };

    data.completedToday=false;
    data.completedAds=0;
    data.todayReward=0;

    saveCurrentUser(user);
  }

  if(data.cycle.rewarded){
    showActivityDone(pid);
    return;
  }

  runActivity(pid);
}

function runActivity(pid){

  const user=currentUser();
  const p=PROGRAMS.find(x=>x.id===pid);
  const data=getPackageData(user,pid);

  let seconds=getDB().settings.adSeconds;

  showPage(`
    ${topbar()}

    <div class="page">

      <button class="btn dark back"
              onclick="openPrograms()">
        ← Back
      </button>

      <div class="card activity">

        <div style="color:var(--gold);font-weight:bold">
          ${p.name}
        </div>

        <div class="small">
          Activity ${data.completedAds+1} / ${getDB().settings.adsPerDay}
        </div>

        <div class="timer" id="activityTimer">
          ${seconds}
        </div>

        <div class="small">
          📱 Complete this eligible activity from your mobile device.
        </div>

        <br>

        <button id="watchBtn"
                class="btn dark"
                disabled>
          WAIT
        </button>

      </div>

    </div>
  `);

  const timer=setInterval(()=>{

    seconds--;

    const el=document.getElementById("activityTimer");

    if(el)el.textContent=seconds;

    if(seconds<=0){

      clearInterval(timer);

      const btn=document.getElementById("watchBtn");

      if(btn){
        btn.disabled=false;
        btn.className="btn green";
        btn.textContent="SUCCESS";
        btn.onclick=()=>completeActivity(pid);
      }

    }

  },1000);
}

function completeActivity(pid){

  const user=currentUser();
  const p=PROGRAMS.find(x=>x.id===pid);

  if(!user||!p)return;

  const db=getDB();
  const data=getPackageData(user,pid);

  if(!data.cycle){
    startActivity(pid);
    return;
  }

  if(data.cycle.rewarded){
    showActivityDone(pid);
    return;
  }

  data.completedAds++;
  data.cycle.completed=data.completedAds;

  saveCurrentUser(user);

/* =========================================================
   CREDIT REWARD
   ========================================================= */

function creditAdReward(memberId,pid){

  const db=getDB();

  const user=db.users.find(u=>u.innovaId===memberId);

  if(!user)return;

  const p=PROGRAMS.find(x=>x.id===pid);
  const data=getPackageData(user,pid);

  if(data.cycle && data.cycle.rewarded){
    return;
  }

  const reward=
    Number(p.price)*
    Number(db.settings.rewardPercent)/
    100;

  data.todayReward=reward;
  data.totalEarned=(data.totalEarned||0)+reward;

  data.cycle=data.cycle||{
    started:Date.now(),
    completed:db.settings.adsPerDay,
    rewarded:false
  };

  data.cycle.rewarded=true;
  data.cycle.completed=db.settings.adsPerDay;

  user.directAdEarning=
    Number(user.directAdEarning||0)+reward;

  user.earnings=
    Number(user.earnings||0)+reward;

  user.balance=
    Number(user.balance||0)+reward;

  user.activityHistory=user.activityHistory||[];

  user.activityHistory.unshift({
    id:Date.now(),
    type:"package_reward",
    program:pid,
    amount:reward,
    createdAt:new Date().toLocaleString("bn-BD")
  });

  db.transactions.unshift({
    id:Date.now()+2,
    memberId:memberId,
    type:"Package Earning",
    amount:reward,
    note:`${p.name} daily eligible reward`,
    createdAt:new Date().toLocaleString("bn-BD")
  });

  db.notifications.unshift({
    id:Date.now()+3,
    type:"earning",
    title:"💰 Activity Reward Credited",
    message:`${memberId} received ${money(reward)} eligible reward.`,
    memberId:memberId,
    createdAt:new Date().toLocaleString("bn-BD"),
    read:false
  });

  saveDB(db);
}

/* =========================================================
   EXPIRY
   ========================================================= */

function autoExpirePackages(){

  const db=getDB();
  let changed=false;

  db.users.forEach(user=>{

    if(!user.packageData)return;

    Object.keys(user.packageData).forEach(pid=>{

      const data=user.packageData[pid];

      if(data.active &&
         data.expiresAt &&
         Date.now()>data.expiresAt){

        data.active=false;
        changed=true;

        db.notifications.unshift({
          id:Date.now()+Math.random(),
          type:"expired",
          title:"📦 Program Expired",
          message:`${user.innovaId} - ${pid} 15 days completed.`,
          memberId:user.innovaId,
          createdAt:new Date().toLocaleString("bn-BD"),
          read:false
        });

      }

    });

  });

  if(changed)saveDB(db);
}

function approvePayment(paymentId){

  const db=getDB();

  const payment=db.payments.find(
    x=>x.id===paymentId
  );

  if(!payment)return;

  const user=db.users.find(
    x=>x.innovaId===payment.memberId
  );

  if(!user)return;

  payment.status="approved";
  payment.approvedAt=new Date().toLocaleString("bn-BD");

  if(payment.type==="id"){

    user.active=true;
    user.idActivationPending=false;
    user.idActivationApproved=true;

    db.notifications.unshift({
      id:Date.now(),
      type:"member",
      title:"🟢 ID Activated Successfully",
      message:`${user.innovaId} আপনার ID Active হয়েছে।`,
      memberId:user.innovaId,
      createdAt:new Date().toLocaleString("bn-BD"),
      read:false
    });

  }

  if(payment.type==="package"){

    const data=getPackageData(user,payment.programId);

    data.active=true;
    data.approved=true;
    data.activatedAt=Date.now();

    data.expiresAt=
      Date.now()+
      Number(db.settings.durationDays)*
      86400000;

    db.notifications.unshift({
      id:Date.now(),
      type:"member",
      title:"📦 Program Activated",
      message:`${payment.programId} আপনার account-এ Active হয়েছে।`,
      memberId:user.innovaId,
      createdAt:new Date().toLocaleString("bn-BD"),
      read:false
    });

  }

  saveDB(db);

  openAdmin();
}

function rejectPayment(paymentId){

  const db=getDB();

  const payment=db.payments.find(
    x=>x.id===paymentId
  );

  if(!payment)return;

  payment.status="rejected";

  db.notifications.unshift({
    id:Date.now(),
    type:"member",
    title:"❌ Payment Rejected",
    message:`${payment.memberId} payment request rejected হয়েছে।`,
    memberId:payment.memberId,
    createdAt:new Date().toLocaleString("bn-BD"),
    read:false
  });

  saveDB(db);

  openAdmin();
}

let roomScale=1;

function zoomRoom(amount){

  if(amount===1){
    roomScale=1;
  }else{
    roomScale*=amount;
    roomScale=Math.max(.5,Math.min(2.5,roomScale));
  }

  const x=document.getElementById("roomInner");

  if(x){
    x.style.transform=`scale(${roomScale})`;
  }
}

function packageTotal(u){

  let total=0;

  PROGRAMS.forEach(p=>{
    total+=Number(
      getPackageData(u,p.id).totalEarned||0
    );
  });

  return total;
}

   ========================================================= */

function openWithdraw(){

  const u=currentUser();

  if(!u){
    openLogin();
    return;
  }

  showPage(`
    ${topbar()}

    <div class="page">

      <button class="btn dark back"
              onclick="openDashboard()">
        ← Back
      </button>

      <div class="card">

        <h2 class="section-title">
          💳 WITHDRAW
        </h2>

        <div class="info-box center">

          <div class="small">
            AVAILABLE BALANCE
          </div>

          <div class="stat-value">
            ${money(u.balance)}
          </div>

        </div>

        <br>

        <div id="withdrawMessage"></div>

        <form onsubmit="submitWithdraw(event)">

          <div class="form-group">
            <label>Amount</label>
            <input id="withdrawAmount"
                   type="number"
                   min="1"
                   required>
          </div>

          <div class="form-group">
            <label>Method</label>
            <select id="withdrawMethod" required>
              <option value="">Select</option>
              <option>bKash</option>
              <option>Nagad</option>
              <option>Bank</option>
            </select>
          </div>

          <div class="form-group">
            <label>Account Number</label>
            <input id="withdrawAccount" required>
          </div>

          <button class="btn green full">
            SUBMIT WITHDRAWAL
          </button>

        </form>

      </div>

    </div>
  `);
}

function submitWithdraw(e){

  e.preventDefault();

  const u=currentUser();
  const db=getDB();

  const amount=Number(
    document.getElementById("withdrawAmount").value
  );

  const method=
    document.getElementById("withdrawMethod").value;

  const account=
    document.getElementById("withdrawAccount").value.trim();

  const msg=document.getElementById("withdrawMessage");

  if(amount<=0){
    msg.innerHTML=`
      <div class="message error">
        Amount সঠিক দিন।
      </div>
    `;
    return;
  }

  if(amount>u.balance){
    msg.innerHTML=`
      <div class="message error">
        ❌ Available Balance-এর চেয়ে বেশি withdraw করা যাবে না।
      </div>
    `;
    return;
  }

  const w={
    id:Date.now(),
    memberId:u.innovaId,
    amount:amount,
    method:method,
    account:account,
    status:"pending",
    createdAt:new Date().toLocaleString("bn-BD")
  };

  db.withdrawals.push(w);

  db.notifications.unshift({
    id:Date.now()+1,
    type:"withdraw",
    title:"💸 New Withdrawal Request",
    message:`${u.innovaId} requested ${money(amount)} withdrawal.`,
    memberId:u.innovaId,
    createdAt:new Date().toLocaleString("bn-BD"),
    read:false
  });

  saveDB(db);

  msg.innerHTML=`
    <div class="message success">
      ✅ Withdrawal request submitted।
    </div>
  `;
}

function submitSupport(e){

  e.preventDefault();

  const u=currentUser();
  const db=getDB();

  const text=
    document.getElementById("supportText").value.trim();

  if(!text)return;

  db.support.unshift({
    id:Date.now(),
    memberId:u.innovaId,
    memberName:u.name,
    message:text,
    status:"pending",
    createdAt:new Date().toLocaleString("bn-BD")
  });

  db.notifications.unshift({
    id:Date.now()+1,
    type:"support",
    title:"🎧 New Support Message",
    message:`${u.innovaId} sent a support message.`,
    memberId:u.innovaId,
    createdAt:new Date().toLocaleString("bn-BD"),
    read:false
  });

  saveDB(db);

  document.getElementById("supportMessage").innerHTML=`
    <div class="message success">
      ✅ আপনার message Admin-এর কাছে পাঠানো হয়েছে।
    </div>
  `;

  document.getElementById("supportText").value="";
}

function saveCurrentUser(user){

  const db=getDB();

  const i=db.users.findIndex(
    x=>x.innovaId===user.innovaId
  );

  if(i>=0){
    db.users[i]=user;
    saveDB(db);
  }
}

function escapeHTML(str){

  return String(str||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
